name: CI & Security Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  ci-security:
    name: Run Tests, Coverage & Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: ".python-version"

      - name: Run Bandit (Code SAST Scan)
        run: uvx bandit -r . -ll -x .venv,tests

      - name: Generate Requirements with Hashes
        run: uv export --all-groups --output-file requirements.txt

      - name: Run pip-audit (Dependency Scan on CVEs)
        run: uvx pip-audit -r requirements.txt --disable-pip

      - name: Run npm audit (Frontend Dependencies)
        run: npm --prefix mop/static audit --audit-level=high

      - name: Clean up temporary files
        if: always()
        run: rm -f requirements.txt

      - name: Create production configuration
        run: |
          mkdir -p instance
          echo "MOP_API_PATH = 'https://openatlas.maps-of-power.at/api/'" > instance/production.py
          echo "ORTHO_API_PATH = 'https://openatlas.orthodoxes-europa.at/api/'" >> instance/production.py

      - name: Run Type Checks (mypy)
        run: uv run mypy mop config.py scripts runserver.py

      - name: Run Tests with Coverage
        run: uv run pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Verify Container Build
        run: docker build -t maps-of-power:ci -f Containerfile .

      - name: Generate Coverage Badge
        if: github.event_name == 'push'
        run: |
          mkdir -p badges
          uvx --with defusedxml genbadge coverage -i coverage.xml -o badges/coverage.svg

      - name: Upload Coverage Badge Artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-badge
          path: badges/coverage.svg

  update-badge:
    name: Commit & Push Coverage Badge
    needs: ci-security
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download Coverage Badge
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-badge
          path: badges

      - name: Commit & Push Coverage Badge
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add badges/coverage.svg
          git commit -m "chore: update coverage badge [skip ci]" || exit 0
          git push
