[project]
name = "maps-of-power"
version = "0.1.0"
description = "Maps of Power: Historical Atlas of Places, Borderzones and Migration Dynamics in Byzantium"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0.0",
    "flask-babel>=4.0.0",
    "flask-caching>=2.1.0",
    "gunicorn>=23.0.0",
    "markupsafe>=3.0.0",
    "pillow>=11.0.0",
    "pydantic>=2.10.0",
    "redis>=5.0.0",
    "requests>=2.32.0",
    "werkzeug>=3.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pylint>=3.3.0",
    "pytest>=9.0.0",
    "pytest-cov>=4.0.0",
    "types-requests>=2.32.0",
]

[tool.pytest.ini_options]
addopts = "-W default -ra -q --no-header --cov=mop --cov=tests --cov-report=html --cov-report=term --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mop"]

[tool.coverage.report]
precision = 2
sort = "Cover"
skip_covered = true

[tool.mypy]
explicit_package_bases = true
allow_untyped_decorators = true
disallow_subclassing_any = false
ignore_missing_imports = true
no_warn_return_any = true
strict = true

[tool.pylint.main]
ignore = ["mop.wsgi"]
extension-pkg-allow-list = ["lxml"]

[tool.pylint.messages_control]
disable = ["missing-docstring", "broad-except", "duplicate-code"]

[tool.pylint.basic]
good-names = ["bc", "c", "e", "ex", "f", "i", "id", "ip", "j", "js", "k", "l", "op", "Run", "r", "rv", "to", "x", "y", "_"]

[tool.pylint.format]
max-line-length = 79
