[project]
name = "maps-of-power"
version = "0.1.0"
description = "Maps of Power: Historical Atlas of Places, Borderzones and Migration Dynamics in Byzantium"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0.0",
    "flask-babel>=4.0.0",
    "flask-caching>=2.1.0",
    "gunicorn>=23.0.0",
    "markupsafe>=3.0.0",
    "pillow>=11.0.0",
    "pydantic>=2.10.0",
    "redis>=5.0.0",
    "requests>=2.32.0",
    "werkzeug>=3.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pylint>=3.3.0",
    "pytest>=9.0.0",
    "pytest-cov>=4.0.0",
    "types-requests>=2.32.0",
]
