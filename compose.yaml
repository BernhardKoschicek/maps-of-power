services:
  web:
    build:
      context: .
      dockerfile: Containerfile
    image: maps-of-power:latest
    container_name: maps-of-power
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-insecure-dev-key-change-in-production}
      - CACHE_TYPE=${CACHE_TYPE:-RedisCache}
      - CACHE_REDIS_URL=${CACHE_REDIS_URL:-redis://redis:6379/0}
      - STORAGE_DIR=/app/storage
      - DEBUG=${DEBUG:-false}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-3}
      - THREADS=${THREADS:-2}
    volumes:
      - ./storage:/app/storage:Z
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: maps-of-power-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    volumes:
      - redis_data:/data:Z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis_data:
