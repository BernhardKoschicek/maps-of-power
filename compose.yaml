services:
  web:
    build:
      context: .
      dockerfile: Containerfile
    image: maps-of-power:latest
    container_name: maps-of-power
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-5000}:5000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - SECRET_KEY=${SECRET_KEY:-}
      - CACHE_TYPE=${CACHE_TYPE:-RedisCache}
      - CACHE_REDIS_URL=${CACHE_REDIS_URL:-redis://redis:6379/0}
      - STORAGE_DIR=/app/storage
      - DEBUG=${DEBUG:-false}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-3}
      - THREADS=${THREADS:-2}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - USE_PROXY_FIX=${USE_PROXY_FIX:-false}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - IIIF_ALLOWED_HOSTS=${IIIF_ALLOWED_HOSTS:-}
    volumes:
      - ./storage:/app/storage:Z
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: maps-of-power-redis
    restart: unless-stopped
    command: >
      redis-server --save "" --appendonly no
      --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data:Z
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis_data:
