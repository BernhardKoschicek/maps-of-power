# ==============================================================================
# Apache 2.4 Virtual Host Configuration for Maps of Power
# Target OS: Debian Trixie (Debian 13)
# ==============================================================================
# Prerequisites for Debian Trixie:
#   sudo apt install apache2 libapache2-mod-wsgi-py3
#   sudo a2enmod wsgi alias headers rewrite deflate
#
# Installation instructions:
#   1. Copy this file:
#      sudo cp instance/example_apache.conf /etc/apache2/sites-available/maps-of-power.conf
#   2. Adjust 'ServerName', project paths (/var/www/maps-of-power), and user/group if needed.
#   3. Enable site and reload Apache:
#      sudo a2ensite maps-of-power.conf
#      sudo systemctl reload apache2
# ==============================================================================

<VirtualHost *:80>
    ServerName maps-of-power.local
    # ServerAlias www.maps-of-power.local
    ServerAdmin webmaster@localhost

    # --------------------------------------------------------------------------
    # WSGI Configuration (mod_wsgi with Python 3.13 on Debian Trixie)
    # --------------------------------------------------------------------------
    # python-home: Path to the virtualenv created via uv (e.g. /var/www/maps-of-power/.venv)
    # python-path: Base project directory
    WSGIDaemonProcess maps-of-power \
        user=www-data \
        group=www-data \
        processes=2 \
        threads=15 \
        display-name=%{GROUP} \
        python-home=/var/www/maps-of-power/.venv \
        python-path=/var/www/maps-of-power \
        lang='C.UTF-8' \
        locale='C.UTF-8'

    WSGIProcessGroup maps-of-power
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /var/www/maps-of-power/mop.wsgi

    # --------------------------------------------------------------------------
    # Root Project Directory Permissions
    # --------------------------------------------------------------------------
    <Directory /var/www/maps-of-power>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # --------------------------------------------------------------------------
    # Serve Static Assets Directly via Apache
    # --------------------------------------------------------------------------
    Alias /static /var/www/maps-of-power/mop/static
    <Directory /var/www/maps-of-power/mop/static>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=604800, immutable"
        </IfModule>
    </Directory>

    # Common Web Root Files
    Alias /favicon.ico          /var/www/maps-of-power/mop/static/favicon.ico
    Alias /robots.txt           /var/www/maps-of-power/mop/static/robots.txt
    Alias /site.webmanifest     /var/www/maps-of-power/mop/static/site.webmanifest
    Alias /browserconfig.xml    /var/www/maps-of-power/mop/static/browserconfig.xml
    Alias /apple-touch-icon.png /var/www/maps-of-power/mop/static/apple-touch-icon.png

    # --------------------------------------------------------------------------
    # Security: Protect Sensitive Directories and Files
    # --------------------------------------------------------------------------
    <DirectoryMatch "/\.(git|venv|mypy_cache|pytest_cache)">
        Require all denied
    </DirectoryMatch>

    <Directory /var/www/maps-of-power/instance>
        Require all denied
    </Directory>

    # --------------------------------------------------------------------------
    # Logging
    # --------------------------------------------------------------------------
    LogLevel warn
    ErrorLog ${APACHE_LOG_DIR}/maps-of-power_error.log
    CustomLog ${APACHE_LOG_DIR}/maps-of-power_access.log combined
</VirtualHost>
