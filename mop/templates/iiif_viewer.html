<div class="row">
  <div id="viewer" style="width: 50%;"></div>
  <script src="{{ url_for('static', filename='node_modules/mirador/dist/mirador.min.js', v=ASSETS_VERSION) }}"></script>
  <script>
    var config = {
      "id": "viewer",
      "layout": "1x1",
      "mainMenuSettings": {
        "show": true
      },
      "workspaceControlPanel": {
        "enabled": true
      },
      "window": {
        "allowClose": false,
        "defaultSideBarPanel": 'attribution',
        "sideBarOpenByDefault": true,
        "forceDrawAnnotations": true,
        "highlightAllAnnotations": true
      },
      "workspace": {
        "type": {{ ("mosaic" if (manifests | default([]) | length) < 9 else "elastic") | tojson }}
      },
      "language": {{ (session.get("language") or CURRENT_LANGUAGE or "en") | tojson }},
      "availableLanguages": {
        "de": "Deutsch",
        "en": "English",
        "fr": "Français"
      },
      "windows": [
          {"loadedManifest": {{ manifest | tojson }}}
      ]
    };
    Mirador.viewer(config);
  </script>
</div>
